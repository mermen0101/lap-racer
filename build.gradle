plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = 'https://maven.terraformersmc.com/releases/' } // Mod Menu
	maven { url = 'https://maven.shedaniel.me/' }                // Cloth Config
	maven { url = 'https://maven.maxhenkel.de/repository/public' } // Simple Voice Chat API
	exclusiveContent {                                            // AlinLib, from Modrinth
		forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// optional: settings screen in Mod Menu (not bundled, not required at runtime)
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// optional: AlinLib toasts (not bundled, not required at runtime)
	compileOnly "maven.modrinth:alinlib:m39JUWcP" // AlinLib-fabric-2.1.0-rc.7.1+mc26.3
	// optional: Simple Voice Chat (the kill-a-car's jammer reaches the radio through its plugin API; not bundled)
	compileOnly "de.maxhenkel.voicechat:voicechat-api:2.6.27"
}

// code shared with the backend (protocol, later the track geometry and lap timing): compiled into the mod
sourceSets.main.java.srcDir 'common/src/main/java'

loom {
	runs {
		client {
			vmArg "-Xmx3G"
		}
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
